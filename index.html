<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />
    <title>Свидание? 💌</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Handjet:wght@400..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Экран конверта -->
    <div id="envelope-container">
      <img src="envelope.png" alt="Конверт" id="envelope" />
      <p>♡ Письмо для тебя ♡</p>
    </div>

    <!-- Экран письма -->
    <div id="letter-container">
      <div class="letter-window">
        <h1 id="letter-title">Пойдёшь со мной<br />на&nbsp;свидание?</h1>

        <img src="cat_heart.gif" class="cat" id="letter-cat" />

        <div class="buttons" id="letter-buttons">
          <img src="yes.png" class="btn yes-btn" alt="Yes" />

          <div class="no-wrapper">
            <img src="no.png" class="btn no-btn" alt="No" />
          </div>
        </div>

        <div id="final-text" class="final-text" style="display: none">
          <b>Свидание назначено! 💛</b><br />
          📅 9 августа &nbsp;·&nbsp; 🕑 14:00<br />
          📍 Улица Асанкулов Азиз, 1/5<br />
          👗 дресс-код: твоя улыбка<br />
          <a class="maplink" href="https://2gis.kg/bishkek/geo/70030077156750960/74.653642,42.775954" target="_blank" rel="noreferrer">📍 открыть на карте</a>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
